<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">公司治理风险检查图</title>
  <desc id="desc">从信息、授权、冲突、记录与退出五个维度检查治理风险。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">公司治理风险检查图</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <g><rect x="360" y="100" width="240" height="74" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="480" y="143.66666666666666" fill="#FFFFFF" font-size="20" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">治理风险检查</text></g>
  <g><rect x="80" y="250" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#168A82" stroke-width="1.5"/><text x="155" y="288.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">信息权</text></g>
  <g><rect x="270" y="250" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#168A82" stroke-width="1.5"/><text x="345" y="288.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">授权边界</text></g>
  <g><rect x="460" y="250" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#C58A3A" stroke-width="1.5"/><text x="535" y="288.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">利益冲突</text></g>
  <g><rect x="650" y="250" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#4C7EA8" stroke-width="1.5"/><text x="725" y="288.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">会议记录</text></g>
  <g><rect x="390" y="380" width="180" height="66" rx="10" fill="#FFFFFF" stroke="#18324B" stroke-width="1.5"/><text x="480" y="418.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">退出机制</text></g>
  <path d="M 430 174 L 155 250" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 460 174 L 345 250" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 500 174 L 535 250" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 530 174 L 725 250" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 480 174 L 480 380" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="480" y="480" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">治理风险往往在平时积累，在交易或争议时集中暴露。</text>

  
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>