<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">股东参与生命周期</title>
  <desc id="desc">进入、持续贡献、角色变化与退出构成完整链条。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">股东参与生命周期</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <g><rect x="80" y="220" width="150" height="80" rx="10" fill="#168A82" stroke="#168A82" stroke-width="1.5"/><text x="155" y="265.3333333333333" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">进入</text></g>
  <path d="M 230 260 L 300 260" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="300" y="220" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#168A82" stroke-width="1.5"/><text x="375" y="265.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">持续贡献</text></g>
  <path d="M 450 260 L 520 260" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="520" y="220" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#C58A3A" stroke-width="1.5"/><text x="595" y="265.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">角色变化</text></g>
  <path d="M 670 260 L 740 260" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="740" y="220" width="140" height="80" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="810" y="265.3333333333333" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">退出</text></g>
  <text x="175" y="340" fill="#657080" font-size="13" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">出资 / 授予</text>
  <text x="375" y="340" fill="#657080" font-size="13" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">归属 / 绩效</text>
  <text x="595" y="340" fill="#657080" font-size="13" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">职责 / 投入</text>
  <text x="810" y="340" fill="#657080" font-size="13" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">转让 / 回购</text>
  <text x="480" y="430" fill="#657080" font-size="15" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">每个阶段都应提前约定信息权与处理规则。</text>

  
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>