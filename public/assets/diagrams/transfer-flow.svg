<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">股权转让与审批流程示意</title>
  <desc id="desc">流程节点为通用讨论框架，不替代具体法域程序。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">股权转让与审批流程示意</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <g><rect x="70" y="190" width="150" height="74" rx="10" fill="#168A82" stroke="#168A82" stroke-width="1.5"/><text x="145" y="232.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">转让意向</text></g>
  <path d="M 220 227 L 280 227" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="280" y="190" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#168A82" stroke-width="1.5"/><text x="355" y="232.33333333333334" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">书面通知</text></g>
  <path d="M 430 227 L 490 227" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="490" y="190" width="170" height="74" rx="10" fill="#FFFFFF" stroke="#4C7EA8" stroke-width="1.5"/><text x="575" y="232.33333333333334" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">优先购买权</text></g>
  <path d="M 660 227 L 720 227" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="720" y="190" width="160" height="74" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="800" y="232.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">签署与交割</text></g>
  <g><rect x="260" y="330" width="160" height="66" rx="10" fill="#FFFFFF" stroke="#8FA3B3" stroke-width="1.5"/><text x="340" y="367.6666666666667" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">内部审批</text></g>
  <g><rect x="520" y="330" width="180" height="66" rx="10" fill="#FFFFFF" stroke="#8FA3B3" stroke-width="1.5"/><text x="610" y="367.6666666666667" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">登记 / 备案</text></g>
  <path d="M 565 264 L 340 330" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 605 264 L 610 330" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="480" y="450" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">通知内容、答复期限与沉默后果必须在条款中明确。</text>

  
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>