<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">多轮融资股权变化示意</title>
  <desc id="desc">按事件顺序重算，而不是直接拼接各轮比例。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">多轮融资股权变化示意</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <g><rect x="70" y="150" width="160" height="70" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="150" y="190.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">创始团队</text></g>
  <path d="M 230 185 L 290 185" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="290" y="150" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#168A82" stroke-width="1.5"/><text x="370" y="190.33333333333334" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">种子轮</text></g>
  <path d="M 450 185 L 510 185" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="510" y="150" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#4C7EA8" stroke-width="1.5"/><text x="590" y="189.66666666666666" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">A 轮 + 期权池</text></g>
  <path d="M 670 185 L 720 185" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="720" y="150" width="170" height="70" rx="10" fill="#FFFFFF" stroke="#C58A3A" stroke-width="1.5"/><text x="805" y="189.66666666666666" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">B 轮 + 转股</text></g>
  <path d="M 70 270 L 890 270" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  <text x="480" y="320" fill="#18324B" font-size="20" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">每次事件后都要更新完全稀释股本</text>
  <g><rect x="170" y="360" width="620" height="90" rx="10" fill="#F6F7F8" stroke="#E2E7EB" stroke-width="1.5"/><text x="480" y="410.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle"></text></g>
  <text x="480" y="400" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">已发行股份 + 已授予期权 + 期权池 + 可转换工具</text>
  <text x="480" y="430" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">不同文件的定义口径必须一致</text>

  
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>