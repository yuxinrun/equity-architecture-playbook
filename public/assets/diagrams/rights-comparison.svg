<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">股权、表决权、分红权与管理权对照</title>
  <desc id="desc">同一种持股比例，可以对应不同的权利组合。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">股权、表决权、分红权与管理权对照</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <g><rect x="60" y="110" width="190" height="70" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="155" y="150.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">股权比例</text></g>
  <g><rect x="280" y="110" width="190" height="70" rx="10" fill="#168A82" stroke="#168A82" stroke-width="1.5"/><text x="375" y="150.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">表决权</text></g>
  <g><rect x="500" y="110" width="190" height="70" rx="10" fill="#4C7EA8" stroke="#4C7EA8" stroke-width="1.5"/><text x="595" y="150.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">分红权</text></g>
  <g><rect x="720" y="110" width="180" height="70" rx="10" fill="#C58A3A" stroke="#C58A3A" stroke-width="1.5"/><text x="810" y="150.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">管理权</text></g>
  <text x="155" y="210" fill="#657080" font-size="13" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">法律所有权口径</text>
  <text x="375" y="210" fill="#657080" font-size="13" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">决议表达口径</text>
  <text x="595" y="210" fill="#657080" font-size="13" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">利润分配口径</text>
  <text x="810" y="210" fill="#657080" font-size="13" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">岗位授权口径</text>
  <path d="M 60 250 L 900 250" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  <text x="480" y="300" fill="#18324B" font-size="20" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">讨论控制权时必须逐项核对</text>
  <g><rect x="160" y="340" width="640" height="110" rx="10" fill="#F6F7F8" stroke="#E2E7EB" stroke-width="1.5"/><text x="480" y="400.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle"></text></g>
  <text x="480" y="380" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">法律强制规则  /  章程自治  /  股东协议  /  实际流程</text>
  <text x="480" y="415" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">任一环节不一致，都可能导致条款无法执行。</text>

  
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>