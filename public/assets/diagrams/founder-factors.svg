<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">创始人股权讨论因素图</title>
  <desc id="desc">现金、时间、技术、资源、风险与未来责任应同时进入讨论。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">创始人股权讨论因素图</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <circle cx="480" cy="290" r="92" fill="#18324B"/>
  <text x="480" y="284" fill="#FFFFFF" font-size="24" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">创始人</text>
  <text x="480" y="312" fill="#C8DAE8" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">股权讨论</text>
  <g><rect x="90" y="110" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#168A82" stroke-width="1.5"/><text x="185" y="145.33333333333334" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">现金出资</text></g>
  <g><rect x="680" y="110" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#168A82" stroke-width="1.5"/><text x="775" y="145.33333333333334" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">全职投入</text></g>
  <g><rect x="70" y="260" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#4C7EA8" stroke-width="1.5"/><text x="165" y="294.6666666666667" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">技术与知识产权</text></g>
  <g><rect x="700" y="260" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#4C7EA8" stroke-width="1.5"/><text x="795" y="295.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">客户与资源</text></g>
  <g><rect x="120" y="410" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#C58A3A" stroke-width="1.5"/><text x="215" y="445.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">承担风险</text></g>
  <g><rect x="650" y="410" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#C58A3A" stroke-width="1.5"/><text x="745" y="445.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">未来责任</text></g>
  <path d="M 290 140 L 392 240" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 670 140 L 568 240" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 265 290 L 384 290" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 695 290 L 576 290" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 310 440 L 404 350" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 650 440 L 556 350" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="480" y="470" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">没有单一公式可以替代团队对假设的显式讨论。</text>

  
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>