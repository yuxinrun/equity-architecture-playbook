<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">公司架构的四个层次</title>
  <desc id="desc">法律、股权、组织与业务架构分别回答不同问题。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">公司架构的四个层次</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <g><rect x="60" y="110" width="180" height="74" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="150" y="152.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">法律架构</text></g>
  <g><rect x="280" y="110" width="180" height="74" rx="10" fill="#168A82" stroke="#168A82" stroke-width="1.5"/><text x="370" y="152.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">股权架构</text></g>
  <g><rect x="500" y="110" width="180" height="74" rx="10" fill="#4C7EA8" stroke="#4C7EA8" stroke-width="1.5"/><text x="590" y="152.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">组织架构</text></g>
  <g><rect x="720" y="110" width="180" height="74" rx="10" fill="#C58A3A" stroke="#C58A3A" stroke-width="1.5"/><text x="810" y="152.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">业务架构</text></g>
  <text x="150" y="214" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">主体 · 责任 · 登记</text>
  <text x="370" y="214" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">所有权 · 权利 · 控制</text>
  <text x="590" y="214" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">决策 · 执行 · 监督</text>
  <text x="810" y="214" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">产品 · 客户 · 现金流</text>
  <path d="M 60 250 L 900 250" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  <g><rect x="100" y="290" width="700" height="150" rx="10" fill="#F6F7F8" stroke="#E2E7EB" stroke-width="1.5"/><text x="450" y="370.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle"></text></g>
  <text x="450" y="330" fill="#18324B" font-size="20" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">同一家公司可以同时拥有四张不同的图</text>
  <text x="450" y="370" fill="#657080" font-size="15" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">不能用一张图回答所有问题，也不能把不同层次的关系混为一条线。</text>

  
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>