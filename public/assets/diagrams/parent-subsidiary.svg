<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">母公司、子公司与业务单元</title>
  <desc id="desc">实线表示股权关系，虚线表示业务管理关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">母公司、子公司与业务单元</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <g><rect x="360" y="110" width="240" height="84" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="480" y="158.66666666666666" fill="#FFFFFF" font-size="20" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">母公司</text></g>
  <path d="M 400 194 L 240 268" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 560 194 L 720 268" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="100" y="270" width="260" height="84" rx="10" fill="#FFFFFF" stroke="#168A82" stroke-width="1.5"/><text x="230" y="317.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">子公司 A</text></g>
  <g><rect x="600" y="270" width="260" height="84" rx="10" fill="#FFFFFF" stroke="#C58A3A" stroke-width="1.5"/><text x="730" y="317.3333333333333" fill="#202733" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">子公司 B</text></g>
  <path d="M 230 354 L 230 420" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 730 354 L 730 420" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g><rect x="120" y="422" width="220" height="62" rx="10" fill="#FFFFFF" stroke="#8FA3B3" stroke-width="1.5"/><text x="230" y="457.6666666666667" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">业务单元 / 产品线</text></g>
  <g><rect x="620" y="422" width="220" height="62" rx="10" fill="#FFFFFF" stroke="#8FA3B3" stroke-width="1.5"/><text x="730" y="457.6666666666667" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">业务单元 / 服务线</text></g>
  <text x="480" y="300" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">独立法律主体</text>
  <text x="480" y="330" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">各自承担相应责任</text>

  <g transform="translate(40,520)"><path d="M 0 0 L 26 0" fill="none" stroke="#18324B" stroke-width="1.4"/><text x="34" y="5" fill="#202733" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="start">持股关系</text></g><g transform="translate(250,520)"><path d="M 0 0 L 26 0" fill="none" stroke="#168A82" stroke-width="1.4" stroke-dasharray="6 6"/><text x="34" y="5" fill="#202733" font-size="12" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="start">业务管理关系</text></g>
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>