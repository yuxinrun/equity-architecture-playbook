<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">融资前后股权稀释示意</title>
  <desc id="desc">简化模型：新增股份扩大分母，原有股份数量不变。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#F6F7F8"/>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#FFFFFF" stroke="#E2E7EB"/>
  <text x="40" y="58" fill="#18324B" font-size="22" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="start">融资前后股权稀释示意</text>
  <path d="M 40 72 L 920 72" fill="none" stroke="#E2E7EB" stroke-width="1.4"/>
  
  <text x="240" y="120" fill="#18324B" font-size="18" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">融资前</text>
  <g><rect x="100" y="150" width="280" height="90" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="240" y="200.33333333333334" fill="#FFFFFF" font-size="16" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">创始团队 80%</text></g>
  <g><rect x="100" y="260" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#8FA3B3" stroke-width="1.5"/><text x="240" y="294.6666666666667" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">现有其他股东 20%</text></g>
  <path d="M 430 250 L 540 250" fill="none" stroke="#8FA3B3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="485" y="225" fill="#168A82" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">增资</text>
  <text x="720" y="120" fill="#18324B" font-size="18" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">融资后</text>
  <g><rect x="590" y="150" width="210" height="90" rx="10" fill="#18324B" stroke="#18324B" stroke-width="1.5"/><text x="695" y="200" fill="#FFFFFF" font-size="15" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">创始团队 72%</text></g>
  <g><rect x="590" y="260" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#8FA3B3" stroke-width="1.5"/><text x="665" y="294.6666666666667" fill="#202733" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">其他 18%</text></g>
  <g><rect x="755" y="260" width="150" height="60" rx="10" fill="#168A82" stroke="#168A82" stroke-width="1.5"/><text x="830" y="294.6666666666667" fill="#FFFFFF" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="600" text-anchor="middle">投资人 10%</text></g>
  <text x="480" y="380" fill="#657080" font-size="14" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="middle">教学数字仅用于说明分母变化；不含期权池、优先权与可转换工具。</text>

  
  <text x="920" y="526" fill="#657080" font-size="11" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-weight="400" text-anchor="end">示意图 / 教学模型</text>
</svg>